# Führt die Spieltests (tests/e2e.py) bei jedem Push und Pull Request aus.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Spieltests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r tests/requirements.txt

      - name: Chromium für Playwright installieren
        run: python -m playwright install --with-deps chromium

      - name: Tests ausführen
        run: python tests/e2e.py

      - name: Layoutprüfung auf allen Geräten
        if: always()
        run: python tests/layout.py --dark --strict --out layout-out

      - name: Layout-Aufnahmen hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-aufnahmen
          path: layout-out/
          retention-days: 14
